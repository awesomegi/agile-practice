<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGILE Practice Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* layout idea: one narrow working column, like a test booklet page; puzzle tiles stay paper-white in both themes */
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#172033; --muted:#5b6579; --line:#d5dbe6;
  --accent:#2447c9; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --good:#12805c; --good-soft:#dff3ea; --bad:#c23a2b; --bad-soft:#fbe5e1; --warn:#a86a00;
  --tile:#fbfbf8; --tile-ink:#1d2433; --tile-line:#c9cfdb;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141d; --panel:#1a2030; --ink:#e8ecf5; --muted:#9aa4b8; --line:#2e3750;
    --accent:#7f9bff; --accent-ink:#0d1220; --accent-soft:#232d4d;
    --good:#4fd1a1; --good-soft:#17352c; --bad:#ff8a7a; --bad-soft:#3d1f1c; --warn:#f0b84a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141d; --panel:#1a2030; --ink:#e8ecf5; --muted:#9aa4b8; --line:#2e3750;
  --accent:#7f9bff; --accent-ink:#0d1220; --accent-soft:#232d4d;
  --good:#4fd1a1; --good-soft:#17352c; --bad:#ff8a7a; --bad-soft:#3d1f1c; --warn:#f0b84a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.primary:disabled{opacity:.45}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:500}
.ghost:hover{border-color:var(--accent)}

/* home */
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .sw{flex:none;width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;margin-top:2px}
.opt .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:left .15s}
.opt[aria-pressed="true"] .sw{background:var(--accent)}
.opt[aria-pressed="true"] .sw::after{left:16px}
.opt b{display:block;font-weight:600;font-size:.95rem}
.opt small{color:var(--muted);font-size:.8rem;line-height:1.3;display:block}
.secs{display:flex;flex-direction:column;gap:8px}
.sec{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.sec:hover{border-color:var(--accent)}
.sec .no{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:1.05rem}
.sec b{font-family:var(--display);font-size:1.05rem}
.sec small{display:block;color:var(--muted);font-size:.85rem}
.sec .last{font-family:var(--mono);font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}
@media (max-width:560px){.opts{grid-template-columns:1fr}h1{font-size:1.6rem}}

/* run bar */
.bar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.bar .t{font-family:var(--display);font-weight:800;flex:1;min-width:0}
.bar .t small{display:block;font-family:var(--body);font-weight:400;color:var(--muted);font-size:.8rem}
.clock{font-family:var(--mono);font-weight:600;font-size:1.15rem;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.clock.low{background:var(--bad-soft);color:var(--bad)}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 16px}
.prompt{font-weight:500;text-align:center;max-width:46ch}
.hint{font-size:.82rem;color:var(--muted);text-align:center}

/* comparator */
.cmprow{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px}
.cmpcard{background:var(--tile);color:var(--tile-ink);border:2px solid var(--tile-line);border-radius:14px;padding:26px 8px;font-family:var(--mono);font-weight:600;font-size:clamp(1.15rem,5vw,1.7rem);display:flex;flex-direction:column;align-items:center;gap:4px}
.cmpcard .val{font-size:.9rem;font-weight:500;opacity:.75}
.cmpeq{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 36px;font-weight:600}
button.cmpcard:not(:disabled):hover,button.cmpeq:not(:disabled):hover{border-color:var(--accent)}
.right{border-color:var(--good)!important;box-shadow:0 0 0 3px var(--good-soft)}
.wrong{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}

/* equator */
.eqrow{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--mono);font-weight:600;font-size:clamp(1.3rem,6vw,2rem);flex-wrap:wrap}
.eqbox{background:var(--tile);color:var(--tile-ink);border:2px solid var(--tile-line);border-radius:10px;padding:8px 14px;min-width:2.2em;text-align:center}
.eqslot{display:flex;gap:4px}
.eqslot .d,.eqop.q{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 0;width:1.5em;text-align:center}
.eqslot .d.cur,.eqop.q.cur{outline:3px solid var(--accent);outline-offset:2px}
.eqslot.ok .d,.eqop.q.ok{background:var(--good);color:#fff}
.keypad{display:grid;grid-template-columns:repeat(5,1fr) 10px repeat(2,1fr);gap:8px;width:100%;max-width:440px}
.keypad .gap{grid-row:span 2}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px}
.key{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px 0;font-family:var(--mono);font-weight:600;font-size:1.15rem}
.key.op{background:var(--accent-soft)}
.key:disabled{opacity:.35}
.key.right,.key.wrong{opacity:1}
.key:not(:disabled):hover{border-color:var(--accent)}

/* seating */
.rules{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px}
.rules p{display:flex;gap:8px;background:var(--bg);border-radius:8px;padding:8px 12px;font-weight:500}
.rules p .mk{flex:none;width:1.1em;color:var(--muted)}
.rules p.ok .mk{color:var(--good)} .rules p.no .mk{color:var(--bad)} .rules p.no{background:var(--bad-soft)}
.pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:62px;padding:8px;border:2px dashed var(--line);border-radius:12px;width:100%;max-width:520px;align-items:center}
.person{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:2px solid transparent;border-radius:10px;padding:4px 8px;font-size:.85rem;font-weight:600}
.person .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800}
.person.sel{border-color:var(--accent);background:var(--accent-soft)}
.person.fixed{color:var(--bad)}
.seats{display:flex;gap:8px;justify-content:center;width:100%;max-width:520px}
.seat{flex:1;max-width:96px;min-height:92px;background:var(--tile);color:var(--tile-ink);border:2px solid var(--tile-line);border-radius:12px 12px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;position:relative}
.seat .n{position:absolute;top:3px;left:7px;font-family:var(--mono);font-size:.75rem;opacity:.6}
.seat .empty{font-family:var(--mono);font-size:1.4rem;opacity:.25}
.seat .person{color:var(--tile-ink);padding:2px}
.seat .person.fixed{color:#b3261e}
.lr{display:flex;justify-content:space-between;width:100%;max-width:520px;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.sl{display:inline-flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:.85rem}
.sl span{background:var(--bg);border-radius:6px;padding:1px 7px}
.sl b{color:var(--accent);margin-right:4px}

/* abstract */
.mgrid,.mopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:330px}
.mcard{background:var(--tile);border:2px solid var(--tile-line);border-radius:10px;padding:0;aspect-ratio:1;display:grid;place-items:center;color:var(--tile-ink);position:relative}
.mcard svg{width:100%;height:100%;display:block}
.mcard.q{border-style:dashed;border-color:var(--accent);font-family:var(--display);font-weight:800;font-size:2rem;color:var(--accent)}
.mcard .k{position:absolute;top:2px;left:6px;font-family:var(--mono);font-size:.7rem;color:#7b8496}
button.mcard:not(:disabled):hover{border-color:var(--accent)}
.sep{width:100%;max-width:330px;border-top:1px dashed var(--line)}

/* detectify */
.dgrids{display:flex;gap:14px;justify-content:center;width:100%}
.dgrids svg{flex:1;max-width:250px;min-width:0;height:auto;background:var(--tile);border:2px solid var(--tile-line);border-radius:10px}
.dgrids.small svg{max-width:170px}
.dtx{font-family:var(--mono);font-weight:600;font-size:15px}

/* feedback + review */
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{font-size:1.05rem}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb .next{align-self:flex-start}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:1.5rem;font-weight:600}
.stat small{color:var(--muted);font-size:.8rem}
.rev{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.rev .mini{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}
.rev .mgrid{max-width:210px;gap:5px}
.rev .picks{display:flex;gap:16px}
.rev figure{margin:0;width:76px;text-align:center;font-size:.75rem;color:var(--muted)}
.rev .dgrids svg{max-width:170px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.95rem}
td.num,th.num{text-align:right}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
ul.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div id="app"></div>
<script>
'use strict';
/* ================= helpers ================= */
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[rint(0, a.length - 1)];
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rint(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mod = (x, m) => ((x % m) + m) % m;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

/* ================= 1. Comparator ================= */
function cmpExpr(v, hard) {
  const f = [];
  if (v >= 4) f.push(() => { const a = rint(2, v - 2); return `${a} + ${v - a}`; });
  f.push(() => { const b = rint(2, hard ? 48 : 25); return `${v + b} − ${b}`; });
  const lim = hard ? 15 : 12, fac = [];
  for (let a = 2; a <= lim; a++) if (v % a === 0 && v / a >= 2 && v / a <= lim) fac.push(a);
  if (fac.length) { const m = () => { const a = pick(fac); return `${a} × ${v / a}`; }; f.push(m, m); }
  if (v <= lim) f.push(() => { const b = rint(2, 9); return `${v * b} ÷ ${b}`; });
  if (hard) {
    f.push(() => { const a = rint(2, 9), b = rint(2, 9), c = v - a * b; return c > 0 ? `${a} × ${b} + ${c}` : c < 0 ? `${a} × ${b} − ${-c}` : `${a} × ${b}`; });
    f.push(() => { const a = rint(5, 40), b = rint(5, 40), c = a + b - v; return c > 0 ? `${a} + ${b} − ${c}` : c < 0 ? `${a} + ${b} + ${-c}` : `${a} + ${b}`; });
  }
  return pick(f)();
}
function genCmp(hard) {
  for (;;) {
    const v = hard ? rint(18, 140) : (Math.random() < 0.35 ? rint(4, 12) : rint(13, 72));
    const w = Math.random() < 0.22 ? v : v + pick([-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]);
    if (w < 2) continue;
    const plainL = Math.random() < 0.12, plainR = !plainL && Math.random() < 0.12;
    const L = plainL ? String(v) : cmpExpr(v, hard), R = plainR ? String(w) : cmpExpr(w, hard);
    if (L === R) continue;
    return { type: 'cmp', L, R, lv: v, rv: w, ans: v > w ? 'left' : w > v ? 'right' : 'equal' };
  }
}

/* ================= 2. Equator ================= */
const OPS = { '+': (a, b) => a + b, '−': (a, b) => a - b, '×': (a, b) => a * b, '÷': (a, b) => (b && a % b === 0 ? a / b : NaN) };
function genEq(hard) {
  for (;;) {
    const op = pick(['+', '−', '×', '÷']);
    let a, b, c;
    if (op === '+') { a = hard ? rint(25, 480) : rint(6, 88); b = hard ? rint(25, 480) : rint(4, 99 - a); c = a + b; }
    else if (op === '−') { a = hard ? rint(60, 900) : rint(14, 99); b = rint(hard ? 15 : 3, a - 2); c = a - b; }
    else if (op === '×') { a = rint(2, hard ? 25 : 12); b = rint(2, hard ? 12 : 9); if (Math.random() < 0.5) [a, b] = [b, a]; c = a * b; if (!hard && c > 99) continue; }
    else { b = rint(2, hard ? 12 : 9); c = rint(2, hard ? 25 : 12); a = b * c; if (!hard && a > 99) continue; }
    if (b < 1) continue;
    const miss = pick(['a', 'b', 'b', 'c', 'op']);
    if (miss === 'op' && Object.keys(OPS).filter((o) => OPS[o](a, b) === c).length !== 1) continue;
    return { type: 'eq', a, b, c, op, miss, ans: miss === 'op' ? op : String({ a, b, c }[miss]) };
  }
}
function eqExplain(q) {
  const full = `${q.a} ${q.op} ${q.b} = ${q.c}`;
  if (q.miss === 'op') {
    const tries = Object.keys(OPS).map((o) => { const raw = o === '÷' ? q.a / q.b : OPS[o](q.a, q.b); return `${q.a} ${o} ${q.b} = ${Number.isInteger(raw) ? raw : raw.toFixed(1)}${o === q.op ? ' ✓' : ''}`; });
    return `Try each operation: <span class="num">${tries.join(' · ')}</span>`;
  }
  if (q.miss === 'c') return `Work it out directly: <span class="num">${full}</span>.`;
  const inv = { '+': () => `${q.c} − ${q.miss === 'a' ? q.b : q.a}`, '−': () => (q.miss === 'a' ? `${q.c} + ${q.b}` : `${q.a} − ${q.c}`), '×': () => `${q.c} ÷ ${q.miss === 'a' ? q.b : q.a}`, '÷': () => (q.miss === 'a' ? `${q.c} × ${q.b}` : `${q.a} ÷ ${q.c}`) }[q.op]();
  return `Undo the operation: <span class="num">${inv} = ${q.ans}</span>. Check: <span class="num">${full}</span>.`;
}

/* ================= 3. Seating ================= */
const NAMES = ['Omar', 'Lina', 'Sami', 'Hana', 'Yara', 'Adam', 'Nora', 'Zaid', 'Tariq', 'Maha'];
const AV_COL = ['#2447c9', '#c2452f', '#0f8a6d', '#8a4fd0', '#b7791f', '#0e7490', '#be185d', '#4d7c0f', '#6b4a2b', '#475569'];
function seatOK(r, pos, n) {
  switch (r.t) {
    case 'pos': return pos[r.a] === r.k;
    case 'notpos': return pos[r.a] !== r.k;
    case 'next': return Math.abs(pos[r.a] - pos[r.b]) === 1;
    case 'notnext': return Math.abs(pos[r.a] - pos[r.b]) !== 1;
    case 'left': return pos[r.a] < pos[r.b];
    case 'right': return pos[r.a] > pos[r.b];
    case 'nextL': return pos[r.a] === pos[r.b] - 1;
    case 'nextR': return pos[r.a] === pos[r.b] + 1;
    case 'end': return pos[r.a] === 1 || pos[r.a] === n;
    case 'if': return !seatOK(r.c, pos, n) || seatOK(r.then, pos, n);
    default: return true;
  }
}
function clause(r, must) {
  const v = must ? ['must be', 'cannot be', 'must not be', 'must sit'] : ['is', 'is not', 'is not', 'sits'];
  switch (r.t) {
    case 'pos': return `${r.a} ${v[0]} in seat ${r.k}`;
    case 'notpos': return `${r.a} ${v[1]} in seat ${r.k}`;
    case 'next': return `${r.a} ${v[0]} next to ${r.b}`;
    case 'notnext': return `${r.a} ${v[2]} next to ${r.b}`;
    case 'left': return `${r.a} ${v[0]} to the left of ${r.b}`;
    case 'right': return `${r.a} ${v[0]} to the right of ${r.b}`;
    case 'nextL': return `${r.a} ${v[0]} directly to the left of ${r.b}`;
    case 'nextR': return `${r.a} ${v[0]} directly to the right of ${r.b}`;
    case 'end': return `${r.a} ${v[3]} at one end`;
    default: return '';
  }
}
const ruleText = (r) => (r.t === 'if' ? `If ${clause(r.c, false)}, then ${clause(r.then, true)}.` : `${clause(r, true)}.`);
function seatSolutions(q) {
  const all = q.fixed ? q.people.concat(q.fixed.name) : q.people.slice();
  const free = []; for (let s = 1; s <= q.n; s++) if (!q.fixed || q.fixed.seat !== s) free.push(s);
  const res = [], arr = q.people.slice();
  const perm = (k) => {
    if (k === arr.length) {
      const pos = {}; arr.forEach((nm, i) => { pos[nm] = free[i]; });
      if (q.fixed) pos[q.fixed.name] = q.fixed.seat;
      if (q.rules.every((r) => seatOK(r, pos, q.n))) { const seats = Array(q.n).fill(null); all.forEach((nm) => { seats[pos[nm] - 1] = nm; }); res.push(seats); }
      return;
    }
    for (let i = k; i < arr.length; i++) { [arr[k], arr[i]] = [arr[i], arr[k]]; perm(k + 1); [arr[k], arr[i]] = [arr[i], arr[k]]; }
  };
  perm(0);
  return res;
}
function genSeat(hard) {
  const RT = ['pos', 'notpos', 'next', 'next', 'notnext', 'notnext', 'left', 'left', 'right', 'right', 'nextL', 'nextR', 'end'];
  for (;;) {
    const n = hard ? pick([4, 5, 5]) : pick([3, 4, 4]);
    const all = shuffle(NAMES).slice(0, n), queue = all.slice();
    let fixed = null;
    if (Math.random() < 0.3) fixed = { name: queue.pop(), seat: rint(1, n) };

  V.reveal(q, $('#stage'), v);
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><h3>${ok ? 'Correct' : 'Not quite'}</h3><p>${V.explain(q)}</p><button class="primary next" type="button" data-next="1">Next question</button></div>`;
  const b = $('[data-next]'); if (b) { b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
function finishSection() {
  const s = S.sec; if (!s) return;
  stopTick(); s.running = false; S.sec = null;
  const n = s.log.length, c = s.log.filter((x) => x.ok).length, avg = n ? s.log.reduce((a, x) => a + x.ms, 0) / n / 1000 : 0;
  const res = { k: s.k, n, c, avg, log: s.log };
  S.run.done.push(res);
  if (n) { S.last[s.k] = { c, n }; save(); }
  const more = S.run.i < S.run.keys.length - 1, full = S.run.keys.length > 1;
  const wrong = s.log.filter((x) => !x.ok);
  const go = () => { if (more) { S.run.i++; intro(); } else if (full) final(); else home(); };
  S.key = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
  app().innerHTML = `<div class="panel stack"><span class="eyebrow">Section complete</span><h2>${META[s.k].name}</h2>
    <div class="score"><div class="stat"><b>${c}/${n}</b><small>correct</small></div><div class="stat"><b>${n ? Math.round(c / n * 100) : 0}%</b><small>accuracy</small></div><div class="stat"><b>${avg.toFixed(1)}s</b><small>per question</small></div></div>
    <div class="row"><button class="primary" type="button" data-go="1">${more ? 'Next section' : full ? 'See results' : 'Back to sections'}</button>${full ? '' : '<button class="ghost" type="button" data-again="1">Try this section again</button>'}</div>
    ${wrong.length ? `<h3>Review your ${wrong.length} mistake${wrong.length > 1 ? 's' : ''}</h3>${wrong.map((x) => `<div class="rev">${VIEW[x.q.type].review(x.q, x.v)}<p class="muted">${VIEW[x.q.type].explain(x.q)}</p></div>`).join('')}` : n ? '<p class="muted">No mistakes in this section.</p>' : '<p class="muted">No questions answered.</p>'}</div>`;
  app().onclick = (e) => { if (e.target.closest('[data-go]')) go(); else if (e.target.closest('[data-again]')) startRun([s.k]); };
  window.scrollTo(0, 0);
}
function final() {
  const d = S.run.done, N = d.reduce((a, r) => a + r.n, 0), C = d.reduce((a, r) => a + r.c, 0);
  const worst = d.filter((r) => r.n).sort((a, b) => a.c / a.n - b.c / b.n)[0];
  S.key = null;
  app().innerHTML = `<div class="panel stack"><span class="eyebrow">Full test complete</span><h2>${C} of ${N} correct</h2>
    <table><thead><tr><th>Section</th><th class="num">Correct</th><th class="num">Accuracy</th><th class="num">Per question</th></tr></thead><tbody>${d.map((r) => `<tr><td>${META[r.k].name}</td><td class="num">${r.c}/${r.n}</td><td class="num">${r.n ? Math.round(r.c / r.n * 100) : 0}%</td><td class="num">${r.avg.toFixed(1)}s</td></tr>`).join('')}</tbody></table>
    ${worst && worst.c < worst.n ? `<p>Lowest accuracy: <b>${META[worst.k].name}</b>. Practise that section on its own next.</p>` : ''}
    <div class="row"><button class="primary" type="button" data-home="1">Back to sections</button>${worst ? `<button class="ghost" type="button" data-sec="${worst.k}">Practise ${META[worst.k].name}</button>` : ''}</div></div>`;
  app().onclick = (e) => { const c = e.target.closest('[data-sec]'); if (c) startRun([c.dataset.sec]); else if (e.target.closest('[data-home]')) home(); };
  window.scrollTo(0, 0);
}
if (typeof document !== 'undefined') {
  document.getElementById('defs').innerHTML = COLS.map((c, i) => `<pattern id="st-${i}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="${PAPER}"/><rect width="3" height="7" fill="${c}"/></pattern><pattern id="dt-${i}" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${PAPER}"/><circle cx="3.5" cy="3.5" r="1.7" fill="${c}"/></pattern>`).join('');
  document.addEventListener('keydown', (e) => { if (e.metaKey || e.ctrlKey || e.altKey) return; if (S.key) S.key(e); });
  home();
} else {
  module.exports = { genCmp, genEq, genSeat, genMat, genDet, seatSolutions, VIEW, specKey, figSvg };
}
</script>
